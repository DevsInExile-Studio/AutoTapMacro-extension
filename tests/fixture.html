<!doctype html><html lang="en"><meta charset="utf-8"><title>AutoTap test garden</title><style>body{font:18px system-ui;padding:35px;background:#f5eacd;color:#2b1d14}button,input,select{padding:12px;margin:8px}#scroller{height:130px;overflow:auto;border:1px solid #777;margin:20px;width:350px}#tall{height:900px}#result{padding:20px;background:#d7e4bf;width:400px}</style><h1>Automation test garden</h1><button id="counter">Add one</button><output id="clicks">0</output><label>Name <input id="name" placeholder="Name"></label><select id="color"><option value="green">Green</option><option value="red">Red</option></select><label id="checkbox-label"><input type="checkbox" id="check">Enabled</label><input id="password" type="password"><input id="card" autocomplete="cc-number"><div id="scroller"><div id="tall">Scrollable content</div></div><div id="result">Ready</div><a id="next" href="/next">Next page</a><script>document.querySelector('#counter').onclick=()=>document.querySelector('#clicks').textContent=Number(document.querySelector('#clicks').textContent)+1;</script></html>
